<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="petrosGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE27A" />
      <stop offset="45%" stop-color="#F5B942" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="petrosCyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c30" />
      <stop offset="100%" stop-color="#060810" />
    </radialGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#petrosGold)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#petrosGold)" stroke-width="2" stroke-dasharray="14 10" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="145" fill="none" stroke="url(#petrosCyber)" stroke-width="3" stroke-opacity="0.5" />

  <!-- Cinema Aperture Blades (AI Petros Camera Eye) -->
  <g transform="translate(256, 256)" filter="url(#glowEffect)">
    <!-- Central P / Cinema Shutter Prism -->
    <path d="M-60 -120 L30 -120 C75 -120 105 -90 105 -45 C105 0 75 30 30 30 L-20 30 L-20 120 L-60 120 Z M-20 -80 L-20 -10 L25 -10 C48 -10 65 -22 65 -45 C65 -68 48 -80 25 -80 Z" fill="url(#petrosGold)" />
    
    <!-- Cyber AI Lens Rays -->
    <polygon points="50,15 110,65 95,75 40,30" fill="url(#petrosCyber)" opacity="0.85" />
    <polygon points="-70,-30 -120,-80 -105,-90 -60,-45" fill="url(#petrosCyber)" opacity="0.85" />
    <circle cx="35" cy="-45" r="12" fill="#00F0FF" opacity="0.9" />
  </g>

  <!-- Futuristic Corner Markers -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#F5B942" stroke-width="3" stroke-linecap="round" />
  <path d="M 472 70 L 472 40 L 442 40" fill="none" stroke="#F5B942" stroke-width="3" stroke-linecap="round" />
  <path d="M 40 442 L 40 472 L 70 472" fill="none" stroke="#F5B942" stroke-width="3" stroke-linecap="round" />
  <path d="M 472 442 L 472 472 L 442 472" fill="none" stroke="#F5B942" stroke-width="3" stroke-linecap="round" />
</svg>
